# =============================================================================
#  Tashih — Apache2 sanal sunucu yapılandırması (PDF musahhihlik çalışma masası)
# =============================================================================
#
#  Bu dosya iki ortamda kullanılır:
#
#  1) Yerel makine (Debian/Ubuntu, apache2):
#       sudo a2enmod proxy proxy_http
#       sudo cp web/apache/tashih.conf /etc/apache2/sites-available/tashih.conf
#       # Belge kökü yolu kurulumunuza göre farklıysa aşağıyı düzenleyin
#       sudo a2ensite tashih
#       sudo systemctl reload apache2
#
#  2) Docker (httpd imajı): Dockerfile bu dosyayı kopyalarken üç ayarı yeniden
#     yazar — belge kökünü httpd varsayılanına, backend adresini "api"
#     servisine çevirir. Dolayısıyla Docker için ayrıca dosya düzenlemek gerekmez.
#
#  Gereksinimler: mod_proxy + mod_proxy_http etkin olmalı
#  (a2enmod proxy proxy_http). Backend'in 127.0.0.1:8000 üzerinde çalışan
#  bir uvicorn olması beklenir.

<VirtualHost *:80>
    # Erişim adresi: http://tashih.local
    # (/etc/hosts içine "127.0.0.1 tashih.local" satırı eklenmeli)
    ServerName tashih.local

    # Derlenmiş frontend (web/dist). Yolunuz farklıysa burayı düzenleyin.
    DocumentRoot /var/www/opencd/web/dist

    <Directory /var/www/opencd/web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA yönlendirme: sunulmayan tüm yollar index.html'e düşer
        FallbackResource /index.html
    </Directory>

    # --- API → backend (uvicorn) ---
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    # --- PDF yüklemeleri (MAX_UPLOAD_MB=50) ---
    LimitRequestBody 52428800
</VirtualHost>
