services:
  api:
    build:
      context: ./server
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LANG: ${LANG:-tr}
      DATA_DIR: /app/data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - tashih-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tashih-data:
